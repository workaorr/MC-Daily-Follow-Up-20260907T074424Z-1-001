                        setLoginFailedAttempts(0);
                        setLoginErrorMsg(lang === 'TH'
                            ? '⚠️ กรอกรหัสผ่านไม่ถูกต้องเกิน 5 ครั้ง ระบบระงับการเข้าสู่ระบบ 30 วินาที เพื่อความปลอดภัย'
                            : '⚠️ Too many failed attempts. Locked out for 30 seconds.');
                    } else {
                        setLoginErrorMsg(lang === 'TH'
                            ? `รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง (ครั้งที่ ${nextAttempts}/5)`
                            : `Incorrect passcode. Please try again (${nextAttempts}/5)`);
                    }
                    return;
                }

                // Authentication Success
                setLoginFailedAttempts(0);
                setLoginLockoutUntil(0);
                setActiveAgentName(chosenAgentName);
                localStorage.setItem('mc_active_agent_name', chosenAgentName);
                localStorage.setItem('mc_last_selected_agent', chosenAgentName);
                localStorage.removeItem('mc_logged_out');
                setLoginPasswordInput('');
                setLoginErrorMsg('');
                setShowLoginPassword(false);
                setIsLoginModalOpen(false);
                setSelectedLoginAgent('');
                writeLog('AUTH', `เข้าสู่ระบบสำเร็จในนาม [${chosenAgentName}] (${matchedAgent ? matchedAgent.role : 'AGENT'})`, 'success', chosenAgentName);

                // Auto-upgrade legacy plain text passcode to SHA-256 hash in storage & Supabase
                if (matchedAgent && matchedAgent.passcode && matchedAgent.passcode.length < 32) {
                    try {
                        const hashed = await hashPasscode(loginPasswordInput.trim());
                        const updatedAgents = agents.map(a => a.id === matchedAgent.id ? { ...a, passcode: hashed } : a);
                        setAgents(updatedAgents);
                        localStorage.setItem('mc_agents', JSON.stringify(updatedAgents));
                        if (supabaseClient) {
                            let query = supabaseClient.from('mc_agents').update({ passcode: hashed });
                            if (matchedAgent.id && typeof matchedAgent.id === 'number' && matchedAgent.id < 1000000000) {
                                query = query.eq('id', matchedAgent.id);
                            } else {
                                query = query.eq('name', chosenAgentName);
                            }
                            query.then();
                        }
                    } catch (e) {
                        console.warn('Auto-upgrade passcode error', e);
                    }
                }
            };

            // DISASTER RECOVERY: 1-CLICK FULL DATABASE JSON BACKUP
            const handleFullSystemBackup = async () => {
                try {
                    let backupDeposits = [];
                    if (supabaseClient) {
                        const { data: depData } = await supabaseClient.from('mc_deposits').select('*');
                        if (Array.isArray(depData)) backupDeposits = depData;
                    }
                    if (backupDeposits.length === 0) {
                        try {
                            const localDep = localStorage.getItem('mc_deposits');
                            if (localDep) backupDeposits = JSON.parse(localDep);
                        } catch (e) {}
                    }

                    const backupPayload = {
                        systemName: 'MC Daily Follow Up',
                        schemaVersion: '2.0-secure',
                        exportTimestamp: new Date().toISOString(),
                        exportedBy: activeAgentName || 'Supervisor',
                        stats: {
                            totalCustomers: customers.length,
                            totalAgents: agents.length,
                            totalDeposits: backupDeposits.length,
                            totalChannels: sourceChannels.length,
                            totalLogs: logs.length
                        },
                        data: {
                            customers: customers,
                            agents: agents,
                            sourceChannels: sourceChannels,
                            deposits: backupDeposits,
                            logs: logs.slice(0, 500)
                        }
                    };

                    const jsonStr = JSON.stringify(backupPayload, null, 2);
                    const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    const d = new Date();
                    const pad = (n) => String(n).padStart(2, '0');
                    const dateTag = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
                    link.setAttribute('href', url);
                    link.setAttribute('download', `MC_Full_Backup_${dateTag}.json`);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);

                    writeLog('BACKUP', `ดาวน์โหลดไฟล์สำรองข้อมูลเต็มระบบ (Full Backup) สำเร็จ [ลูกค้า ${customers.length} คน, พนักงาน ${agents.length} คน]`, 'success', activeAgentName);
                    alert(lang === 'TH'
                        ? `✅ สำรองข้อมูลระบบทั้งหมดสำเร็จเรียบร้อย!\n\n• ลูกค้า: ${customers.length} รายการ\n• พนักงาน: ${agents.length} คน\n• ธุรกรรมฝาก: ${backupDeposits.length} รายการ\n• ช่องทาง: ${sourceChannels.length} ช่องทาง\n\nไฟล์ JSON ถูกดาวน์โหลดลงในเครื่องของคุณแล้ว`
                        : `✅ Full system backup created successfully!\n\n• Customers: ${customers.length} records\n• Agents: ${agents.length} staff\n• Deposits: ${backupDeposits.length} records\n• Channels: ${sourceChannels.length} channels\n\nJSON backup file has been saved to your device.`);
                } catch (err) {
                    console.error('Backup failed', err);
                    alert(lang === 'TH' ? `❌ ไม่สามารถสำรองข้อมูลได้: ${err.message}` : `❌ Backup failed: ${err.message}`);
                    writeLog('BACKUP', `สำรองข้อมูลล้มเหลว: ${err.message}`, 'danger', activeAgentName);
                }
            };

            // DISASTER RECOVERY: 1-CLICK FULL DATABASE JSON RESTORE
            const handleFullSystemRestore = (file) => {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const content = JSON.parse(e.target.result);
                        const backupData = content.data || content;
                        if (!backupData || (!backupData.customers && !backupData.agents)) {
                            throw new Error(lang === 'TH' ? 'โครงสร้างไฟล์ Backup ไม่ถูกต้อง (ไม่พบข้อมูลลูกค้าหรือพนักงาน)' : 'Invalid backup file structure (customers or agents missing)');
                        }

                        const custCount = Array.isArray(backupData.customers) ? backupData.customers.length : 0;
                        const agentCount = Array.isArray(backupData.agents) ? backupData.agents.length : 0;
                        const depCount = Array.isArray(backupData.deposits) ? backupData.deposits.length : 0;

                        const confirmed = window.confirm(
                            lang === 'TH'
                                ? `⚠️ คำเตือนความปลอดภัย (Disaster Recovery Restore):\n\n` +
                                  `คุณกำลังจะกู้คืนระบบจากไฟล์ Backup:\n` +
                                  `• ลูกค้า: ${custCount} คน\n` +
                                  `• พนักงาน: ${agentCount} คน\n` +
                                  `• ธุรกรรมฝาก: ${depCount} รายการ\n` +
                                  `• วันที่สำรอง: ${content.exportTimestamp || 'ไม่ระบุ'}\n\n` +
                                  `ข้อมูลในเครื่องและบนคลาวด์จะถูกอัปเดตและแทนที่ด้วยข้อมูลจากไฟล์ Backup นี้\n` +
                                  `คุณต้องการดำเนินการต่อหรือไม่?`
                                : `⚠️ Security Warning (Disaster Recovery Restore):\n\n` +
                                  `You are about to restore the system from backup file:\n` +
                                  `• Customers: ${custCount} records\n` +
                                  `• Agents: ${agentCount} staff\n` +
                                  `• Deposits: ${depCount} records\n` +
                                  `• Backup Date: ${content.exportTimestamp || 'N/A'}\n\n` +
                                  `Local and cloud data will be updated and replaced by this backup.\n` +
                                  `Do you wish to proceed?`
                        );
                        if (!confirmed) return;

                        // 1. Restore to Local State & Storage
                        if (Array.isArray(backupData.customers)) {
                            setCustomers(backupData.customers);
                            localStorage.setItem('mc_customers', JSON.stringify(backupData.customers));
                        }
                        if (Array.isArray(backupData.agents)) {
                            const normalized = backupData.agents.map((a, i) => normalizeAgent(a, i));
                            setAgents(normalized);
                            localStorage.setItem('mc_agents', JSON.stringify(normalized));
                        }
                        if (Array.isArray(backupData.sourceChannels)) {
                            setSourceChannels(backupData.sourceChannels);
                            localStorage.setItem('mc_source_channels', JSON.stringify(backupData.sourceChannels));
                        }
                        if (Array.isArray(backupData.deposits)) {
                            localStorage.setItem('mc_deposits', JSON.stringify(backupData.deposits));
                        }

                        // 2. Batch Sync to Supabase if connected
                        if (supabaseClient) {
                            try {
                                if (Array.isArray(backupData.agents) && backupData.agents.length > 0) {
                                    const agentsToUpsert = backupData.agents.map(a => ({
                                        name: a.name,
                                        role: a.role || 'AGENT',
                                        login_username: a.loginUsername || a.login_username || '',
                                        passcode: a.passcode || '1234',
                                        permissions: a.permissions || {}
                                    }));
                                    await supabaseClient.from('mc_agents').upsert(agentsToUpsert, { onConflict: 'name' });
                                }
                                if (Array.isArray(backupData.sourceChannels) && backupData.sourceChannels.length > 0) {
                                    const channelsToUpsert = backupData.sourceChannels.map(ch => ({ name: typeof ch === 'string' ? ch : ch.name }));
                                    await supabaseClient.from('mc_source_channels').upsert(channelsToUpsert, { onConflict: 'name' });
                                }
                                if (Array.isArray(backupData.customers) && backupData.customers.length > 0) {
                                    for (let i = 0; i < backupData.customers.length; i += 50) {
                                        const batch = backupData.customers.slice(i, i + 50).map(c => ({
                                            username: c.username,
                                            full_name: c.fullName || '',
                                            phone: c.phone || '',
                                            line_oa: c.lineOA || '',
                                            line_lek: c.lineLek || '',
                                            source_channel: c.sourceChannel || '',
                                            referrer: c.referrer || '',
                                            campaign_month: c.campaignMonth || '',
                                            notes: c.notes || '',
                                            follow_up: c.followUp || {},
                                            created_by: c.createdBy || '',
                                            created_at: c.createdAt || new Date().toISOString()
                                        }));
                                        await supabaseClient.from('mc_customers').upsert(batch, { onConflict: 'username' });
                                    }
                                }
                            } catch (sbErr) {
                                console.warn('Supabase restore partial error', sbErr);
                            }
                        }

                        writeLog('DISASTER_RECOVERY', `กู้คืนระบบจากไฟล์ Backup สำเร็จ [ลูกค้า ${custCount} คน, พนักงาน ${agentCount} คน]`, 'success', activeAgentName);
                        alert(lang === 'TH'
                            ? `🎉 กู้คืนข้อมูลระบบสำเร็จเรียบร้อยแล้ว!\n\n• ลูกค้า: ${custCount} คน\n• พนักงาน: ${agentCount} คน\n• ซิงค์เข้าคลาวด์เรียบร้อยแล้ว`
                            : `🎉 System restored successfully!\n\n• Customers: ${custCount} records\n• Agents: ${agentCount} staff\n• Synced with cloud successfully.`);
                    } catch (parseErr) {
                        console.error('Restore error', parseErr);
                        alert(lang === 'TH' ? `❌ เกิดข้อผิดพลาดในการกู้คืน: ${parseErr.message}` : `❌ Restore error: ${parseErr.message}`);
                    }
                };
                reader.readAsText(file);
            };

            // DATA COMPUTATIONS FILTERED BY SELECTED MONTH & CUSTOM DATE RANGE
            const getRegistrationDateStr = (cust) => {
                if (cust.createdAt) {
                    return cust.createdAt.substring(0, 10); // YYYY-MM-DD
                }
                try {
                    if (cust.id > 1000000000000) {
                        return new Date(cust.id).toISOString().substring(0, 10);
                    }
                } catch(e) {}
                return '';
            };

            const customersArray = Array.isArray(customers) ? customers.filter(Boolean) : [];
            const monthCustomers = customersArray.filter(c => {
                if (!c) return false;
                if (selectedMonth !== 'ALL') {
                    const isCurrent = c.campaignMonth === selectedMonth;
                    const isPastPending = Boolean(c.campaignMonth && c.campaignMonth < selectedMonth && !c.hasDeposited);
                    const isConv = c.convertedInMonth === selectedMonth;
                    if (!isCurrent && !isPastPending && !isConv) return false;
                }
                return true;
            });

            const filteredCustomers = monthCustomers.filter(c => {
                const regDate = getRegistrationDateStr(c);
                const depDate = c.lastDepositDate || '';

                if (startDateFilter || endDateFilter) {
                    const isRegMatch = Boolean(regDate && (!startDateFilter || regDate >= startDateFilter) && (!endDateFilter || regDate <= endDateFilter));
                    const isDepMatch = Boolean(depDate && (!startDateFilter || depDate >= startDateFilter) && (!endDateFilter || depDate <= endDateFilter));

                    if (!isRegMatch && !isDepMatch) return false;
                }
                return true;
            });
            
            // Extract all unique months from database to populate selector dropdown safely
            const uniqueMonths = Array.from(new Set([currentMonthStr, ...customersArray.map(c => (c && c.campaignMonth) || currentMonthStr)])).sort().reverse();
            const monthsList = ['ALL', ...uniqueMonths];

            // ACTIVE AGENT & PERMISSION SYSTEM
            const currentActiveAgent = agents.find(a => a.name === activeAgentName);
            const isSupervisor = Boolean(
                (currentActiveAgent && currentActiveAgent.role === 'SUPERVISOR') ||
                (activeAgentName && (
                    activeAgentName.includes('อ้อที่สวยสวย') ||
                    activeAgentName.includes('ศรัณยา') ||
                    activeAgentName.includes('Sarah') ||
                    activeAgentName.includes('หัวหน้า')
                ))
            );
            const activePermissions = currentActiveAgent?.permissions || (isSupervisor ? {
                canDashboard: true, canFollowUp: true, canNewCustomer: true, canAudit: true, canBackOffice: true
            } : {
                canDashboard: true, canFollowUp: true, canNewCustomer: true, canAudit: false, canBackOffice: false
            });
            const canBackOffice = isSupervisor || Boolean(activePermissions?.canBackOffice);
            const canAudit = isSupervisor || Boolean(activePermissions?.canAudit);
            const canDashboard = isSupervisor || (activePermissions?.canDashboard !== false);
            const canFollowUp = isSupervisor || (activePermissions?.canFollowUp !== false);
            const canNewCustomer = isSupervisor || (activePermissions?.canNewCustomer !== false);

            // Auto-redirect to allowed tab if current viewMode is inaccessible
            useEffect(() => {
                const isCurrentModeAllowed = 
                    (viewMode === 'supervisor' && canDashboard) ||
                    (viewMode === 'agent' && canFollowUp) ||
                    (viewMode === 'upload-deposits') ||
                    (viewMode === 'new-customer' && canNewCustomer) ||
                    (viewMode === 'audit' && canAudit) ||
                    ((viewMode === 'backoffice' || viewMode === 'audit-logs') && canBackOffice);

                if (!isCurrentModeAllowed) {
                    if (canFollowUp) switchViewMode('agent');
                    else if (canDashboard) switchViewMode('supervisor');
                    else if (canNewCustomer) switchViewMode('new-customer');
                    else switchViewMode('upload-deposits');
                }
            }, [viewMode, canAudit, canBackOffice, canDashboard, canFollowUp, canNewCustomer]);
            const filterDate = endDateFilter || startDateFilter;
            const isDepositedAsOfDate = (c) => {
                if (!c.hasDeposited) return false;
                if (!filterDate) return true;
                const depDate = c.lastDepositDate || (c.createdAt ? c.createdAt.substring(0, 10) : '');
                if (!depDate) return true;
                return depDate <= filterDate;
            };

            const totalCount = filteredCustomers.length;
            const totalNotReg = filteredCustomers.filter(c => !c.username || c.username.trim() === '').length;
            const totalReg = filteredCustomers.filter(c => c.username && c.username.trim() !== '').length;
            const totalDeposited = filteredCustomers.filter(c => c.username && c.username.trim() !== '' && isDepositedAsOfDate(c)).length;
            const totalNotDeposited = filteredCustomers.filter(c => c.username && c.username.trim() !== '' && !isDepositedAsOfDate(c)).length;

            const notRegPct = totalCount > 0 ? Math.round((totalNotReg / totalCount) * 100) : 0;
            const regPct = totalCount > 0 ? Math.round((totalReg / totalCount) * 100) : 0;
            const depositCr = totalReg > 0 ? Math.round((totalDeposited / totalReg) * 100) : 0;
            const pendingDepPct = totalReg > 0 ? Math.round((totalNotDeposited / totalReg) * 100) : 0;

            const totalAccumulatedDeposit = filteredCustomers.reduce((sum, c) => sum + (c.totalDeposit || 0), 0);
            const totalFirstDeposit = filteredCustomers.reduce((sum, c) => sum + (c.returnedDepositAmount || 0), 0);
            const displayDepositValue = depositMetricMode === 'FIRST' ? totalFirstDeposit : totalAccumulatedDeposit;

            // Agent performance distribution list for current month
            const agentStats = agents.map(agent => {
                const agentCusts = filteredCustomers.filter(c => c.createdBy === agent.name);
                const totalContacted = agentCusts.length;
                const contactedNotRegistered = agentCusts.filter(c => !c.username || c.username.trim() === '').length;
                const contactedRegistered = agentCusts.filter(c => c.username && c.username.trim() !== '').length;
                const registeredAndDeposited = agentCusts.filter(c => c.username && c.username.trim() !== '' && isDepositedAsOfDate(c)).length;
                const registeredNotDeposited = agentCusts.filter(c => c.username && c.username.trim() !== '' && !isDepositedAsOfDate(c)).length;
                const totalDeposit = agentCusts.reduce((sum, c) => {
                    const amt = depositMetricMode === 'FIRST'
                        ? (c.returnedDepositAmount || 0)
                        : (c.totalDeposit || 0);
                    return sum + amt;
                }, 0);

                return { 
                    name: agent.name, 
                    totalContacted, 
                    contactedNotRegistered, 
                    contactedRegistered, 
                    registeredAndDeposited, 
                    registeredNotDeposited, 
                    totalDeposit 
                };
            });

            // TOP 3 AGENTS WHO FOLLOWED UP CUSTOMERS TO DEPOSIT (KPI 3 อันดับพนักงานตามลูกค้ามาฝากได้สูงสุด)
            const top3Agents = [...agentStats]
                .sort((a, b) => (b.registeredAndDeposited - a.registeredAndDeposited) || (b.totalDeposit - a.totalDeposit))
                .slice(0, 3);
            const hasAnyTopAgentDeposits = top3Agents.some(a => a.registeredAndDeposited > 0 || a.totalDeposit > 0);

            // DEPOSITED CUSTOMERS BY REGISTRATION SOURCE CHANNEL RANKING (แยกตามช่องทางการสมัครของลูกค้าที่ฝากเงิน)
            const depositedCustList = filteredCustomers.filter(c => c.username && c.username.trim() !== '' && isDepositedAsOfDate(c));
            const depositChannelMap = {};
            depositedCustList.forEach(c => {
                const rawCh = (c.sourceChannel || '').trim();
                const chName = rawCh || 'ไม่ระบุช่องทาง';
                if (!depositChannelMap[chName]) {
                    depositChannelMap[chName] = {
                        name: chName,
                        count: 0,
                        totalDeposit: 0,
                        firstDeposit: 0
                    };
                }
                depositChannelMap[chName].count += 1;
                depositChannelMap[chName].totalDeposit += (c.totalDeposit || 0);
                depositChannelMap[chName].firstDeposit += (c.returnedDepositAmount || 0);
            });

            const rankedDepositChannels = Object.values(depositChannelMap)
                .sort((a, b) => (b.count - a.count) || (b.totalDeposit - a.totalDeposit));

            const getChannelBadgeInfo = (rawName) => {
                const n = (rawName || '').toLowerCase().trim();
                const isLight = theme === 'light';
                
                if (n.includes('facebook') || n === 'fb') {
                    return {
                        label: 'Facebook',
                        icon: '🌐',
                        bg: isLight ? '#dbeafe' : 'rgba(59, 130, 246, 0.25)',
                        text: isLight ? '#1e40af' : '#93c5fd',
                        border: isLight ? '#93c5fd' : 'rgba(59, 130, 246, 0.5)'
                    };
                }
                if (n.includes('line')) {
                    return {
                        label: 'LINE Official',
                        icon: '💬',
                        bg: isLight ? '#dcfce7' : 'rgba(34, 197, 94, 0.25)',
                        text: isLight ? '#166534' : '#86efac',
                        border: isLight ? '#86efac' : 'rgba(34, 197, 94, 0.5)'
                    };
                }
                if (n.includes('google')) {
                    return {
                        label: 'Google Search',
                        icon: '🔍',
                        bg: isLight ? '#fef3c7' : 'rgba(245, 158, 11, 0.25)',
                        text: isLight ? '#92400e' : '#fde047',
                        border: isLight ? '#fcd34d' : 'rgba(245, 158, 11, 0.5)'
                    };
                }
                if (n.includes('tiktok')) {
                    return {
                        label: 'TikTok',
                        icon: '🎵',
                        bg: isLight ? '#fce7f3' : 'rgba(236, 72, 153, 0.25)',
                        text: isLight ? '#9d174d' : '#f472b6',
                        border: isLight ? '#f472b6' : 'rgba(236, 72, 153, 0.5)'
                    };
                }
                if (n.includes('เพื่อน')) {
                    return {
                        label: 'เพื่อนแนะนำ',
                        icon: '🤝',
                        bg: isLight ? '#f3e8ff' : 'rgba(168, 85, 247, 0.25)',
                        text: isLight ? '#6b21a8' : '#d8b4fe',
                        border: isLight ? '#c084fc' : 'rgba(168, 85, 247, 0.5)'
                    };
                }
                if (n.includes('doopen') || n.includes('team')) {
                    return {
                        label: 'Doopenteam',
                        icon: '🚀',
                        bg: isLight ? '#e0f2fe' : 'rgba(14, 165, 233, 0.25)',
                        text: isLight ? '#0369a1' : '#7dd3fc',
                        border: isLight ? '#7dd3fc' : 'rgba(14, 165, 233, 0.5)'
                    };
                }
                return {
                    label: rawName || 'ไม่ระบุ',
                    icon: '📌',
                    bg: isLight ? '#f1f5f9' : 'rgba(148, 163, 184, 0.25)',
                    text: isLight ? '#1e293b' : '#f1f5f9',
                    border: isLight ? '#cbd5e1' : 'rgba(148, 163, 184, 0.5)'
                };
            };

            // Filtered customers for Supervisor Audit view
            const displayedAuditCustomers = filteredCustomers.filter(c => {
                if (auditAgentFilter !== 'ทั้งหมด' && c.createdBy !== auditAgentFilter) return false;
                if (lineLekFilter && lineLekFilter !== 'ALL' && lineLekFilter !== 'ทั้งหมด') {
                    const lk = (c.lineLek || '').trim();
                    const isWait = !lk || lk === 'รอแอด' || lk === 'รอแอดไลน์เล็ก';
                    const isNone = lk === 'ไม่มี' || lk === 'ไม่มีไลน์เล็ก';
                    const isHas = !isWait && !isNone;
                    if ((lineLekFilter === 'HAS' || lineLekFilter === 'มี') && !isHas) return false;
                    if ((lineLekFilter === 'WAITING' || lineLekFilter === 'รอแอด') && !isWait) return false;
                    if ((lineLekFilter === 'NONE' || lineLekFilter === 'ไม่มี') && !isNone) return false;
                }
                if (auditSearchQuery.trim()) {
                    const q = auditSearchQuery.trim().toLowerCase();
                    const matchName = (c.fullName || '').toLowerCase().includes(q);
                    const matchUser = (c.username || '').toLowerCase().includes(q);
                    const matchPhone = (c.phone || '').toLowerCase().includes(q);
                    const matchLine = (c.lineOA || '').toLowerCase().includes(q) || (c.lineLek || '').toLowerCase().includes(q);
                    const matchAgent = (c.createdBy || '').toLowerCase().includes(q);
                    if (!matchName && !matchUser && !matchPhone && !matchLine && !matchAgent) return false;
                }
                return true;
            });

            // Filtered customers and aggregations for Executive Reports view

                                    const cLineHas = filteredCustomers.filter(c => c.lineLek === 'มี' || c.lineLek === 'มีไลน์เล็ก').length;
                                    const cLineWaiting = filteredCustomers.filter(c => c.lineLek === 'รอแอด' || c.lineLek === 'รอแอดไลน์เล็ก' || !c.lineLek).length;
                                    const cLineNone = filteredCustomers.filter(c => c.lineLek === 'ไม่มี' || c.lineLek === 'ไม่มีไลน์เล็ก').length;

                                    const displayList = filteredCustomers.filter(c => {
                                        const hasUser = Boolean(c.username && c.username.trim() !== '');
                                        const isDep = isDepositedAsOfDate(c);
                                        if (statusFilter === 'NOT_REGISTERED' && hasUser) return false;
                                        if (statusFilter === 'REGISTERED' && !hasUser) return false;
                                        if (statusFilter === 'DEPOSITED' && (!hasUser || !isDep)) return false;
                                        if (statusFilter === 'NOT_DEPOSITED' && (!hasUser || isDep)) return false;

                                        // Line Lek Filter
                                        if (lineLekFilter && lineLekFilter !== 'ALL' && lineLekFilter !== 'ทั้งหมด') {
                                            const lk = c.lineLek || 'รอแอด';
                                            if (lineLekFilter === 'HAS' || lineLekFilter === 'มี') {
                                                if (lk !== 'มี' && lk !== 'มีไลน์เล็ก') return false;
                                            } else if (lineLekFilter === 'WAITING' || lineLekFilter === 'รอแอด') {
                                                if (lk !== 'รอแอด' && lk !== 'รอแอดไลน์เล็ก') return false;
                                            } else if (lineLekFilter === 'NONE' || lineLekFilter === 'ไม่มี') {
                                                if (lk !== 'ไม่มี' && lk !== 'ไม่มีไลน์เล็ก') return false;
                                            }
                                        }

                                        if (sourceChannelFilter && sourceChannelFilter !== 'ทั้งหมด') {
                                            const src = (c.sourceChannel || '').toLowerCase();
                                            const target = (sourceChannelFilter || '').toLowerCase();
                                            if (target === 'ค้นหาหน้า google' || target === 'google') {
                                                if (src !== 'ค้นหาหน้า google' && src !== 'google') return false;
                                            } else {
                                                if (src !== target) return false;
                                            }
                                        }
                                        return true;
                                    });

                                    return (
                                        <React.Fragment>
                                            <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', margin: '12px 0 10px 0' }}>
                                                {/* Status Filter Row */}
                                                <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap', alignItems: 'center' }}>
                                                    <span style={{ fontSize: '12px', color: 'var(--text-muted)', fontWeight: 600 }}>{lang === 'TH' ? '📌 กรองตามสถานะ:' : '📌 Filter Status:'}</span>
                                                    <button className={`btn ${statusFilter === 'ALL' ? 'btn-primary' : 'btn-secondary'}`} style={{ padding: '4px 10px', fontSize: '11px' }} onClick={() => setStatusFilter('ALL')}>
                                                        {lang === 'TH' ? 'ทั้งหมด' : 'All'} ({cAll})
                                                    </button>
                                                    <button className={`btn ${statusFilter === 'NOT_REGISTERED' ? 'btn-primary' : 'btn-secondary'}`} style={{ padding: '4px 10px', fontSize: '11px', color: '#fbbf24' }} onClick={() => setStatusFilter('NOT_REGISTERED')}>
                                                        {lang === 'TH' ? '🟠 ทักไม่สมัคร' : '🟠 Inquired (Not Reg)'} ({cNotReg})
                                                    </button>
                                                    <button className={`btn ${statusFilter === 'REGISTERED' ? 'btn-primary' : 'btn-secondary'}`} style={{ padding: '4px 10px', fontSize: '11px', color: '#38bdf8' }} onClick={() => setStatusFilter('REGISTERED')}>
                                                        {lang === 'TH' ? '🔵 ทักสมัคร' : '🔵 Registered'} ({cReg})
                                                    </button>
                                                    <button className={`btn ${statusFilter === 'DEPOSITED' ? 'btn-primary' : 'btn-secondary'}`} style={{ padding: '4px 10px', fontSize: '11px', color: 'var(--secondary)' }} onClick={() => setStatusFilter('DEPOSITED')}>
                                                        {lang === 'TH' ? '🟢 สมัครและฝาก' : '🟢 Reg & Deposited'} ({cDep})
                                                    </button>
                                                    <button className={`btn ${statusFilter === 'NOT_DEPOSITED' ? 'btn-primary' : 'btn-secondary'}`} style={{ padding: '4px 10px', fontSize: '11px', color: '#f43f5e' }} onClick={() => setStatusFilter('NOT_DEPOSITED')}>
                                                        {lang === 'TH' ? '🔴 สมัครไม่ฝาก' : '🔴 Reg (No Deposit)'} ({cNotDep})
                                                    </button>
                                                </div>

                                                {/* Line Lek Status Filter Row */}
                                                <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap', alignItems: 'center' }}>
                                                    <span style={{ fontSize: '12px', color: 'var(--text-muted)', fontWeight: 600 }}>{lang === 'TH' ? '💬 กรองสถานะไลน์เล็ก:' : '💬 Filter LINE Lek:'}</span>
                                                    <button className={`btn ${lineLekFilter === 'ALL' ? 'btn-primary' : 'btn-secondary'}`} style={{ padding: '4px 10px', fontSize: '11px' }} onClick={() => setLineLekFilter('ALL')}>
                                                        {lang === 'TH' ? 'ทั้งหมด' : 'All'} ({cLineAll})
                                                    </button>
                                                    <button className={`btn ${lineLekFilter === 'HAS' ? 'btn-primary' : 'btn-secondary'}`} style={{ padding: '4px 10px', fontSize: '11px', color: '#34d399' }} onClick={() => setLineLekFilter('HAS')}>
                                                        {lang === 'TH' ? '🟢 มีไลน์' : '🟢 Has LINE'} ({cLineHas})
                                                    </button>
                                                    <button className={`btn ${lineLekFilter === 'WAITING' ? 'btn-primary' : 'btn-secondary'}`} style={{ padding: '4px 10px', fontSize: '11px', color: '#fbbf24' }} onClick={() => setLineLekFilter('WAITING')}>
                                                        {lang === 'TH' ? '🟡 รอแอด' : '🟡 Pending Add'} ({cLineWaiting})
                                                    </button>
                                                    <button className={`btn ${lineLekFilter === 'NONE' ? 'btn-primary' : 'btn-secondary'}`} style={{ padding: '4px 10px', fontSize: '11px', color: '#f43f5e' }} onClick={() => setLineLekFilter('NONE')}>
                                                        {lang === 'TH' ? '🔴 ไม่มีไลน์' : '🔴 No LINE'} ({cLineNone})
                                                    </button>
                                                </div>
                                            </div>

                                            <div className="table-wrapper" style={{ marginTop: '12px' }}>
                                                <table>
                                                    <thead>
                                                        <tr>
                                                            <th>{lang === 'TH' ? 'ชื่อ-นามสกุล' : 'Full Name'}</th>
                                                            <th>{lang === 'TH' ? 'ยูสเซอร์ลูกค้า' : 'Username'}</th>
                                                            <th style={{ whiteSpace: 'nowrap' }}>{lang === 'TH' ? 'วัน-เวลาที่คีย์ข้อมูล' : 'Date & Time Added'}</th>
                                                            <th>{lang === 'TH' ? 'ข้อมูลการติดต่อ' : 'Contact Info'}</th>
                                                            <th>{lang === 'TH' ? 'สถานะไลน์เล็ก' : 'LINE Lek Status'}</th>
                                                            <th>{lang === 'TH' ? 'ช่องทาง' : 'Source'}</th>
                                                            <th>{lang === 'TH' ? 'ผู้รับผิดชอบ (Owner)' : 'Assigned Owner'}</th>
                                                            <th>{lang === 'TH' ? 'โน้ตเริ่มต้น' : 'Initial Note'}</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {displayList.length === 0 ? (
                                                            <tr>
                                                                <td colSpan="8" style={{ textAlign: 'center', color: 'var(--text-muted)', padding: '30px' }}>
                                                                    {lang === 'TH' ? 'ไม่พบประวัติข้อมูลลูกค้าในเงื่อนไขการกรองนี้' : 'No customer records found matching this filter.'}
                                                                </td>
                                                            </tr>
                                                        ) : (
                                                            displayList.map(cust => (
                                                                <tr key={cust.id}>
                                                                    <td><strong style={{ color: theme === 'light' ? '#0f172a' : '#ffffff', fontWeight: 700 }}>{cust.fullName || '-'}</strong></td>
                                                                    <td>
                                                                        {cust.username ? (
                                                                            <strong style={{ color: theme === 'light' ? '#0f172a' : '#ffffff' }}>{cust.username}</strong>
                                                                        ) : (
                                                                            <span style={{ color: '#fbbf24', fontSize: '11px', fontWeight: 600 }}>{lang === 'TH' ? '(ยังไม่สมัคร)' : '(Not Reg)'}</span>
                                                                        )}
                                                                    </td>
                                                                    <td>
                                                                        <div style={{
                                                                            display: 'inline-flex',
                                                                            alignItems: 'center',
                                                                            gap: '6px',
                                                                            background: theme === 'light' ? 'rgba(56, 189, 248, 0.08)' : 'rgba(56, 189, 248, 0.12)',
                                                                            border: theme === 'light' ? '1px solid rgba(56, 189, 248, 0.25)' : '1px solid rgba(56, 189, 248, 0.3)',
                                                                            borderRadius: '6px',
                                                                            padding: '3px 8px',
                                                                            whiteSpace: 'nowrap'
                                                                        }}>
                                                                            <i data-lucide="calendar" style={{ width: '12px', height: '12px', color: '#38bdf8', flexShrink: 0 }}></i>
                                                                            <span style={{ fontSize: '11.5px', fontWeight: 600, color: theme === 'light' ? '#0284c7' : '#7dd3fc' }}>
                                                                                {formatKeyedDateTime(cust.createdAt)}
                                                                            </span>
                                                                        </div>
                                                                    </td>
                                                                    <td>
                                                                        <div style={{ display: 'flex', flexDirection: 'column', gap: '2px', fontSize: '11px' }}>
                                                                            {cust.phone && <span>📞 {cust.phone}</span>}
                                                                            {cust.lineOA && <span style={{ color: 'var(--success)' }}>💬 {cust.lineOA}</span>}
                                                                        </div>
                                                                    </td>
                                                                    <td>
                                                                        {cust.lineLek === 'มี' || cust.lineLek === 'มีไลน์เล็ก' ? (
                                                                            <span className="badge badge-saved">🟢 {lang === 'TH' ? 'มี' : 'Has LINE'}</span>
                                                                        ) : cust.lineLek === 'ไม่มี' || cust.lineLek === 'ไม่มีไลน์เล็ก' ? (
                                                                            <span className="badge" style={{ background: theme === 'light' ? '#f1f5f9' : 'rgba(255,255,255,0.05)', color: 'var(--text-muted)' }}>⚪ {lang === 'TH' ? 'ไม่มี' : 'No LINE'}</span>
                                                                        ) : (
                                                                            <span className="badge badge-pending">🟡 {lang === 'TH' ? 'รอแอด' : 'Pending'}</span>
                                                                        )}
                                                                    </td>
                                                                    <td>
                                                                        <span className="badge" style={{ background: 'rgba(168,85,247,0.15)', color: '#c084fc', border: '1px solid rgba(168,85,247,0.3)' }}>
                                                                            {cust.sourceChannel}
                                                                        </span>
                                                                    </td>
                                                                    <td>
                                                                        {cust.createdBy ? (
                                                                            <span className="badge badge-owner">
                                                                                <i data-lucide="user" style={{ width: '13px', height: '13px', flexShrink: 0 }}></i>
                                                                                <span>{cust.createdBy}</span>
                                                                            </span>
                                                                        ) : (
                                                                            <span style={{ color: 'var(--text-muted)', fontSize: '11.5px' }}>-</span>
                                                                        )}
                                                                    </td>
                                                                    <td style={{ fontSize: '11px', color: 'var(--text-muted)', maxWidth: '180px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                                                                        {cust.notes || '-'}
                                                                    </td>
                                                                </tr>
                                                            ))
                                                        )}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </React.Fragment>
                                    );
                                })()}
                            </div>
                        </React.Fragment>
                    )}

                        {/* VIEW 3: CRM STAFF WORKSPACE CHECKLIST */}
                        {viewMode === 'agent' && (() => {
                            const effectiveFollowUpAgent = isSupervisor ? supervisorFollowUpFilter : activeAgentName;
                            const isDepositedAsOfDate = (c) => Boolean(c.hasDeposited);

                            const agentCusts = monthCustomers.filter(c => effectiveFollowUpAgent === 'ทั้งหมด' || c.createdBy === effectiveFollowUpAgent);
                            
                            const cAll = agentCusts.length;
                            const cNotReg = agentCusts.filter(c => !c.username || c.username.trim() === '').length;
                            const cReg = agentCusts.filter(c => c.username && c.username.trim() !== '').length;
                            const cDep = agentCusts.filter(c => c.username && c.username.trim() !== '' && isDepositedAsOfDate(c)).length;
                            const cNotDep = agentCusts.filter(c => c.username && c.username.trim() !== '' && !isDepositedAsOfDate(c)).length;

                            // Past months backlog calculations for Agent Table
                            const targetMonth = selectedMonth === 'ALL' ? currentMonthStr : selectedMonth;
                            const isPastMonth = (c) => Boolean(c.campaignMonth && c.campaignMonth < targetMonth);
                            const isCurrentMonth = (c) => Boolean(!c.campaignMonth || c.campaignMonth >= targetMonth);

                            const cPastTotal = agentCusts.filter(isPastMonth).length;
                            const cPastUnconverted = agentCusts.filter(c => isPastMonth(c) && !isDepositedAsOfDate(c)).length;
                            const cPastNotReg = agentCusts.filter(c => isPastMonth(c) && (!c.username || c.username.trim() === '')).length;
                            const cPastNotDep = agentCusts.filter(c => isPastMonth(c) && Boolean(c.username && c.username.trim() !== '') && !isDepositedAsOfDate(c)).length;
                            const cCurrentOnly = agentCusts.filter(c => isCurrentMonth(c)).length;

                            // List of distinct past months available in agentCusts (e.g. ['2026-08', '2026-07'])
                            const pastMonthsList = Array.from(new Set(agentCusts.filter(isPastMonth).map(c => c.campaignMonth))).filter(Boolean).sort().reverse();

                            // Line Lek status counts for Agent table
                            const getLineLekStatus = (lineLek) => {
                                const val = (lineLek || '').trim();
                                if (!val || val === 'รอแอด' || val === 'รอแอดไลน์เล็ก') return 'WAITING';
                                if (val === 'ไม่มี' || val === 'ไม่มีไลน์เล็ก') return 'NONE';
                                return 'HAS';
                            };
                            const cLineAll = agentCusts.length;
                            const cLineHas = agentCusts.filter(c => getLineLekStatus(c.lineLek) === 'HAS').length;
                            const cLineWaiting = agentCusts.filter(c => getLineLekStatus(c.lineLek) === 'WAITING').length;
                            const cLineNone = agentCusts.filter(c => getLineLekStatus(c.lineLek) === 'NONE').length;

                            // Filter agentCusts by selected month scope
                            const scopeCusts = agentCusts.filter(c => {
                                if (pastMonthSpecificFilter === 'CURRENT') return isCurrentMonth(c);
                                if (pastMonthSpecificFilter === 'PAST_ALL') return isPastMonth(c);
                                if (pastMonthSpecificFilter && pastMonthSpecificFilter !== 'ALL') return c.campaignMonth === pastMonthSpecificFilter;
                                return true;
                            });

                            const cScopeAll = scopeCusts.length;
                            const cScopeUnconv = scopeCusts.filter(c => !isDepositedAsOfDate(c)).length;
                            const cScopeNotReg = scopeCusts.filter(c => !c.username || c.username.trim() === '').length;
                            const cScopeReg = scopeCusts.filter(c => c.username && c.username.trim() !== '').length;
                            const cScopeDep = scopeCusts.filter(c => c.username && c.username.trim() !== '' && isDepositedAsOfDate(c)).length;
                            const cScopeNotDep = scopeCusts.filter(c => c.username && c.username.trim() !== '' && !isDepositedAsOfDate(c)).length;

                            const displayList = scopeCusts.filter(c => {
                                const hasUser = Boolean(c.username && c.username.trim() !== '');
                                const isDep = isDepositedAsOfDate(c);

                                // Status Filters
                                if (['UNCONVERTED', 'PAST_UNCONVERTED'].includes(statusFilter) && isDep) return false;
                                if (['NOT_REGISTERED', 'PAST_NOT_REGISTERED'].includes(statusFilter) && hasUser) return false;
                                if (statusFilter === 'REGISTERED' && !hasUser) return false;
                                if (statusFilter === 'DEPOSITED' && (!hasUser || !isDep)) return false;
                                if (['NOT_DEPOSITED', 'PAST_NOT_DEPOSITED'].includes(statusFilter) && (!hasUser || isDep)) return false;

                                // Line Lek Filter
                                if (lineLekFilter && lineLekFilter !== 'ALL' && lineLekFilter !== 'ทั้งหมด') {
                                    const st = getLineLekStatus(c.lineLek);
                                    if (lineLekFilter !== st && lineLekFilter !== (st === 'HAS' ? 'มี' : st === 'WAITING' ? 'รอแอด' : 'ไม่มี')) return false;
                                }

                                if (sourceChannelFilter && sourceChannelFilter !== 'ทั้งหมด') {
                                    const src = (c.sourceChannel || '').toLowerCase();
                                    const target = (sourceChannelFilter || '').toLowerCase();
                                    if (target === 'ค้นหาหน้า google' || target === 'google') {
                                        if (src !== 'ค้นหาหน้า google' && src !== 'google') return false;
                                    } else {
                                        if (src !== target) return false;
                                    }
                                }
                                return true;
                            });

                            return (
                                <div className="panel" style={{ padding: 0 }}>
                                    {/* STICKY TOP CONTROLS & FILTER SECTION (LOCKED ON SCROLL) */}
                                    <div className="agent-sticky-header-container">
                                        <div className="panel-header" style={{ padding: '18px 24px 8px 24px', borderBottom: 'none' }}>
                                            <h3 className="panel-title" style={{ fontSize: '16px' }}>
                                                <i data-lucide="clipboard-list"></i> {lang === 'TH' ? 'ตารางความคืบหน้าการติดตามและจดบันทึกโน้ตของเจ้าหน้าที่' : 'Customer Follow-Up & Call Logging Sheet'}
                                            </h3>
                                            
                                            <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                                                {isSupervisor ? (
                                                    <React.Fragment>
                                                        <span style={{ fontSize: '13px', color: 'var(--text-muted)' }}>{lang === 'TH' ? '👑 เลือกดูงานของเจ้าหน้าที่ (Supervisor):' : '👑 View Agent Work (Supervisor):'}</span>
                                                        <select 
                                                            className="select-input"
                                                            value={supervisorFollowUpFilter}
                                                            onChange={(e) => setSupervisorFollowUpFilter(e.target.value)}
                                                        >
                                                            <option value="ทั้งหมด">{lang === 'TH' ? 'พนักงานทั้งหมด (ดูรวม)' : 'All MC Agents (Overview)'}</option>
                                                            {agents.map(a => (
                                                                <option key={a.id} value={a.name}>{a.name}</option>
                                                            ))}
                                                        </select>
                                                    </React.Fragment>
                                                ) : (
                                                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                                                        <span style={{ fontSize: '13px', color: 'var(--text-muted)' }}>{lang === 'TH' ? 'เจ้าหน้าที่:' : 'Agent:'}</span>
                                                        <span className="badge badge-owner" style={{ fontSize: '12px', fontWeight: 700, padding: '5px 12px' }}>
                                                            <i data-lucide="user" style={{ width: '13px', height: '13px' }}></i>
                                                            <span>{activeAgentName || 'MC Agent'} ({lang === 'TH' ? 'บัญชีของคุณ' : 'Your Account'})</span>
                                                        </span>
                                                    </div>
                                                )}
                                            </div>
                                        </div>

                                        <p style={{ fontSize: '13px', color: 'var(--text-muted)', margin: '0 24px 10px 24px' }}>
                                            {effectiveFollowUpAgent === 'ทั้งหมด' ? (
                                                lang === 'TH'
                                                    ? <>ระบบแสดงรายการลูกค้าทั้งหมดในพอร์ตทุกพนักงาน ประจำรอบเดือน <strong>{selectedMonth}</strong></>
                                                    : <>Showing all portfolio customer records across all agents for month <strong>{selectedMonth}</strong></>
                                            ) : (
                                                lang === 'TH'
                                                    ? <>ระบบกรองเฉพาะลูกค้าในพอร์ตความรับผิดชอบของ <strong>{effectiveFollowUpAgent}</strong> ประจำรอบเดือน <strong>{selectedMonth}</strong> พนักงานสามารถติ๊กเช็กงานโทรรายวันและจดโน้ตเพื่อบันทึกพฤติกรรมลูกค้าได้ทันทีครับ</>
                                                    : <>Filtered customers assigned to <strong>{effectiveFollowUpAgent}</strong> for month <strong>{selectedMonth}</strong>. Track daily follow-up calls and log customer notes.</>
                                            )}
                                        </p>

                                        {/* Unified Filter Card */}
                                        <div style={{ margin: '0 24px 14px 24px' }}>
                                            <div className="filter-card-box">
                                                {/* Row 1: Month Dropdown Filter + Customer Status Buttons */}
                                                <div style={{ display: 'flex', gap: '12px', flexWrap: 'wrap', alignItems: 'center' }}>
                                                    {/* Month Selector (ฟิลเตอร์ที่เลือกเดือน) */}
                                                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                                                        <span style={{ fontSize: '12.5px', fontWeight: 700, color: theme === 'light' ? '#334155' : '#e2e8f0', display: 'flex', alignItems: 'center', gap: '5px', whiteSpace: 'nowrap' }}>
                                                            📅 {lang === 'TH' ? 'เลือกรอบเดือน:' : 'Select Month:'}
                                                        </span>
                                                        <select
                                                            className="select-input"
                                                            style={{
                                                                padding: '5px 12px',
                                                                fontSize: '12px',
                                                                fontWeight: 600,
                                                                borderRadius: '8px',
                                                                height: '32px',
                                                                cursor: 'pointer',
                                                                minWidth: '220px',
                                                                borderColor: pastMonthSpecificFilter !== 'ALL' ? 'var(--primary)' : (theme === 'light' ? '#cbd5e1' : 'rgba(255,255,255,0.15)'),
                                                                background: pastMonthSpecificFilter !== 'ALL' 
                                                                    ? (theme === 'light' ? '#f5f3ff' : 'rgba(124, 58, 237, 0.15)') 
                                                                    : (theme === 'light' ? '#ffffff' : 'rgba(15, 23, 42, 0.8)'),
                                                                color: pastMonthSpecificFilter !== 'ALL' ? 'var(--primary)' : 'inherit'
                                                            }}
                                                            value={pastMonthSpecificFilter}
                                                            onChange={(e) => setPastMonthSpecificFilter(e.target.value)}
                                                        >
                                                            <option value="ALL">{lang === 'TH' ? `🌐 ข้อมูลทุกรอบเดือน (${cAll} คน)` : `🌐 All Months Data (${cAll} leads)`}</option>
                                                            <option value="CURRENT">{lang === 'TH' ? `✨ เฉพาะเดือนปัจจุบัน (${cCurrentOnly} คน)` : `✨ Current Month Only (${cCurrentOnly} leads)`}</option>
                                                            <option value="PAST_ALL">{lang === 'TH' ? `⏳ รวมทุกเดือนย้อนหลัง (${cPastTotal} คน | ไม่ฝาก ${cPastUnconverted})` : `⏳ All Past Months Backlog (${cPastTotal} leads | Pending ${cPastUnconverted})`}</option>
                                                            {pastMonthsList.map(m => {

                                                onClick={() => {
                                                    const sql = "-- 1. เพิ่มคอลัมน์ customer_count ในตาราง mc_source_channels\nALTER TABLE public.mc_source_channels ADD COLUMN IF NOT EXISTS customer_count INT DEFAULT 0;\n\n-- 2. ดึงช่องทางที่มีลูกค้าใช้งานอยู่แล้วแต่ยังไม่มีในตารางเข้ามาอัตโนมัติ (เช่น 'เซียน')\nINSERT INTO public.mc_source_channels (name, is_default, created_by)\nSELECT DISTINCT TRIM(LOWER(source_channel)), false, 'ระบบกลาง'\nFROM public.mc_customers\nWHERE source_channel IS NOT NULL AND TRIM(source_channel) != ''\n  AND TRIM(LOWER(source_channel)) NOT IN (SELECT TRIM(LOWER(name)) FROM public.mc_source_channels)\nON CONFLICT (name) DO NOTHING;\n\n-- 3. อัปเดตจำนวนลูกค้าปัจจุบันทันที\nUPDATE public.mc_source_channels sc\nSET customer_count = (\n  SELECT COUNT(*) FROM public.mc_customers c\n  WHERE TRIM(LOWER(COALESCE(c.source_channel, ''))) = TRIM(LOWER(sc.name))\n);\n\n-- 4. ติดตั้ง Trigger อัปเดตยอดลูกค้าอัตโนมัติแบบเรียลไทม์\nCREATE OR REPLACE FUNCTION public.sync_mc_source_channel_counts()\nRETURNS TRIGGER AS $$\nBEGIN\n  IF (TG_OP = 'UPDATE' OR TG_OP = 'DELETE') THEN\n    IF OLD.source_channel IS NOT NULL THEN\n      UPDATE public.mc_source_channels\n      SET customer_count = (\n        SELECT COUNT(*) FROM public.mc_customers WHERE TRIM(LOWER(COALESCE(source_channel, ''))) = TRIM(LOWER(OLD.source_channel))\n      ) WHERE TRIM(LOWER(name)) = TRIM(LOWER(OLD.source_channel));\n    END IF;\n  END IF;\n  IF (TG_OP = 'INSERT' OR TG_OP = 'UPDATE') THEN\n    IF NEW.source_channel IS NOT NULL THEN\n      UPDATE public.mc_source_channels\n      SET customer_count = (\n        SELECT COUNT(*) FROM public.mc_customers WHERE TRIM(LOWER(COALESCE(source_channel, ''))) = TRIM(LOWER(NEW.source_channel))\n      ) WHERE TRIM(LOWER(name)) = TRIM(LOWER(NEW.source_channel));\n    END IF;\n  END IF;\n  RETURN NULL;\nEND;\n$$ LANGUAGE plpgsql SECURITY DEFINER;\n\nDROP TRIGGER IF EXISTS trg_sync_source_channel_counts ON public.mc_customers;\nCREATE TRIGGER trg_sync_source_channel_counts\nAFTER INSERT OR UPDATE OF source_channel OR DELETE ON public.mc_customers\nFOR EACH ROW EXECUTE FUNCTION public.sync_mc_source_channel_counts();";

                                                    } else {

    <!-- MC FastBoot Engine: High-Performance JSX Caching & Instant Boot System -->
    <script>
        (function() {
            var scriptEl = document.getElementById('mc-app-code');
            if (!scriptEl) return;
            var sourceCode = scriptEl.textContent;

            // Fast hash of source code to detect any edits or updates
            var hash = 5381;
            for (var i = 0; i < sourceCode.length; i++) {
                hash = ((hash << 5) + hash) + sourceCode.charCodeAt(i);
                hash = hash & hash;
            }
            var cacheKey = 'mc_jsx_cache_v1_' + Math.abs(hash);

            var cachedCode = null;
            try {
                cachedCode = localStorage.getItem(cacheKey);
            } catch (e) {}

            function runScript(code) {
                var s = document.createElement('script');
                s.type = 'text/javascript';
                s.textContent = code;
                document.body.appendChild(s);
            }

            if (cachedCode) {
                // INSTANT ZERO-DELAY LOAD: Compiled JS found in cache!
                console.log('⚡ [MC FastBoot] Loaded compiled application from cache in ~5ms');
                runScript(cachedCode);
            } else {
                // First-time compile with Babel (or recompile after code edit)
                function compileAndRun() {
                    if (typeof Babel === 'undefined') {
                        setTimeout(compileAndRun, 30);
                        return;
                    }
                    console.log('🔄 [MC FastBoot] Compiling JSX source code with Babel...');
                    var t0 = performance.now();
                    try {
                        var compiled = Babel.transform(sourceCode, {
                            presets: [['react', { runtime: 'classic' }]]
                        }).code;
                        console.log('✅ [MC FastBoot] Compiled in ' + Math.round(performance.now() - t0) + 'ms. Saving cache...');
                        try {
                            for (var k in localStorage) {
                                if (k && k.indexOf('mc_jsx_cache_') === 0) {
                                    localStorage.removeItem(k);
                                }
                            }
                            localStorage.setItem(cacheKey, compiled);
                        } catch (e) {}
                        runScript(compiled);
                    } catch (err) {
                        console.error('❌ [MC FastBoot] Compilation error:', err);
                        var errDiv = document.createElement('div');
                        errDiv.style.cssText = 'position:fixed;top:20px;left:20px;right:20px;background:#1e1b4b;border:2px solid #f43f5e;color:#fff;padding:24px;border-radius:14px;z-index:99999;font-family:monospace;';
                        errDiv.innerHTML = '<h3 style="color:#fb7185;margin-top:0">⚠️ FastBoot Compilation Error</h3><pre style="white-space:pre-wrap;color:#fca5a5">' + err.message + '</pre>';
                        document.body.appendChild(errDiv);
                    }
                }
                compileAndRun();
            }
        })();
    </script>
